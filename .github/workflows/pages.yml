name: Deploy RecSys Playground

on:
  push:
    branches:
      - main
    paths:
      - "playground/**"
      - "reports/**"
      - "scripts/export_playground.py"
      - "scripts/verify_playground.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and export self-contained playground
        run: |
          python scripts/verify_playground.py
          python scripts/export_playground.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload playground artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/recommendation-systems-playground-portable

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
