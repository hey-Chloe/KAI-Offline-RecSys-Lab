name: Offline RecSys Lab CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-recsys-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies
        run: python -m pip install -e .

      - name: Run tests and truth-boundary checks
        run: make PYTHON=python test

      - name: Run deterministic small reproduction
        run: make PYTHON=python reproduce-small

      - name: Verify tracked public evidence
        run: make PYTHON=python verify-public

      - name: Verify local-only playground
        run: make PYTHON=python verify-playground
